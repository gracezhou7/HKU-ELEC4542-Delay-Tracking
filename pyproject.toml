[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "delay-tracking"
version = "0.1.0"
description = "PyTorch data pipeline for delay-aware multi-object tracking experiments"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "torch>=2.2",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["data"]
exclude = ["tests"]
namespaces = false
